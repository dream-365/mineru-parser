name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      verify-tag:
        description: Verify that the pushed tag matches the package version before building.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Verify tag matches package version
        if: github.event_name == 'workflow_call' && inputs.verify-tag
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mineru_parser/_version.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Smoke test installed wheel
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir/venv" --python 3.13
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          "$smoke_dir/venv/bin/python" -I -c "
          import pathlib, sysconfig, mineru_parser
          pkg = pathlib.Path(mineru_parser.__file__).resolve()
          purelib = pathlib.Path(sysconfig.get_paths()['purelib']).resolve()
          assert purelib in pkg.parents, f'imported {pkg}, expected under {purelib}'
          print('mineru_parser', mineru_parser.__version__, 'from', pkg)
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
