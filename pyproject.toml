[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineru-parser"
version = "0.1.0"
description = "Task-handle based client for the MinerU extraction API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "requests>=2.32",
    "urllib3>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/mineru_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
